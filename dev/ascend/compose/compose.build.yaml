services:
  control-image:
    image: ek-runtime:${TAG:-dev}
    build:
      context: ../../..
      dockerfile: container/Dockerfile.cpu
      target: ek-runtime
      args:
        RUST_IMAGE: docker.m.daocloud.io/library/rust:1.88.0-bookworm
        RUNTIME_IMAGE: docker.m.daocloud.io/library/debian:bookworm-slim
        UV_IMAGE: ghcr.nju.edu.cn/astral-sh/uv:0.11.30

  worker-image:
    image: ek-ascend-runtime:${TAG:-dev}
    build:
      context: ../../..
      dockerfile: container/Dockerfile.npu
      target: ek-ascend-runtime
      args:
        VLLM_ASCEND_IMAGE: quay.io/ascend/vllm-ascend:v0.26.0rc2-a3@sha256:8cbb72814ec80978ab15c0164c43b4e60541cecd1d9f6f4b143ba6ecb4ff63f6

  attention-image:
    image: ek-ascend-runtime:${TAG:-dev}
    build:
      context: ../../..
      dockerfile: container/Dockerfile.npu
      target: ek-ascend-runtime
      args:
        VLLM_ASCEND_IMAGE: quay.io/ascend/vllm-ascend:v0.26.0rc2-a3@sha256:8cbb72814ec80978ab15c0164c43b4e60541cecd1d9f6f4b143ba6ecb4ff63f6
