project_name: ek-deepseek-v4-flash-w8a8
inference:
  instance_name: ek-deepseek-v4-flash-w8a8
images:
  rust: docker.m.daocloud.io/library/rust:1.88.0-bookworm
  uv: ghcr.nju.edu.cn/astral-sh/uv:0.11.30
  control_base: docker.m.daocloud.io/library/debian:bookworm-slim
  vllm_ascend: quay.io/ascend/vllm-ascend:v0.26.0rc2-a3@sha256:8cbb72814ec80978ab15c0164c43b4e60541cecd1d9f6f4b143ba6ecb4ff63f6
  postgres: docker.m.daocloud.io/library/postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
  control: ek-runtime:dev
  attention: ek-ascend-runtime:dev
  expert: ek-ascend-runtime:dev
attention:
  node: node-a
  vllm_port: 18000
  devices: [0]
control:
  node: node-a
  postgres_port: 15432
  worker_control_port: 15001
  frontend_control_port: 15002
  weight_server_port: 16543
  database:
    user: dev
    password: dev
    name: dev
    max_connections: 32
  fault_detection:
    heartbeat_timeout_secs: 10
    node_active_threshold_secs: 60
    poller_interval_secs: 5
expert:
  runtime:
    max_batch_tokens: 4096
    max_active_batches_per_device: 1
    max_pending_batches_per_device: 8
    device_memory_limit: 56GiB
    shutdown_grace_secs: 30
    heartbeat_interval_secs: 3
    heartbeat_timeout_secs: 10
    max_concurrent_loads: 8
pools:
  - id: worker-pool1
    node: node-a
    # Native eager MoE pipeline captured for Decode; use torch for its separate graph path.
    backend: ascend_fused
    # Each Worker retains 32 experts per layer; match the experiment's fixed intervals.
    devices: [1, 2, 3, 4, 5, 6, 7, 8]
    start_worker_port: 53234
    start_peer_port: 54234
# Replace every 192.0.2.10 address in both inputs with the host's routable IP.
nodes:
  node-a:
    address: 192.0.2.10
paths:
  models:
    deepseek-v4-flash-w8a8: "<DEEPSEEK_V4_FLASH_0731_W8A8_MODEL_DIR>"
  datasets: {}
  results: "<RESULTS_DIR>"
