# Worker model facts are resolved from Weight Server metadata at startup.
model:
  name: Qwen3-30B-A3B-w8a8
  path_ref: qwen3-30b-a3b-w8a8
  weight_version: main
  weight_dtype: bf16
  activation_dtype: bf16
dataset:
  type: random
  name: Random
serve:
  gpu_memory_utilization: 0.8
  max_model_len: 4096
  quantization: ascend
run:
  num_prompts: 4
  max_concurrency: 1
  input_len: 128
  output_len: 32
  num_warmups: 1
  ignore_eos: false
  temperature: 0
  save_result: true
ascend_decode_graph:
  capture_sizes:
  - 1
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  timeout_seconds: 600.0
