# Worker model facts are resolved from Weight Server metadata at startup.
model:
  name: Qwen3-30B-A3B
  path_ref: qwen3-30b-a3b
  weight_version: main
  weight_dtype: bf16
  activation_dtype: bf16

# Random needs no path fields. For a file-backed dataset, replace this block
# with one of the ShareGPT or custom examples below.
dataset:
  type: random
  name: Random

# dataset:
#   type: sharegpt
#   name: ShareGPT
#   path_ref: sharegpt
#   mounted_path: /dataset/sharegpt
#   file: ShareGPT.json

# dataset:
#   type: custom
#   name: CodeAgent
#   path_ref: code-agent
#   mounted_path: /dataset/code-agent
#   file: requests.jsonl

serve:
  gpu_memory_utilization: 0.5
  max_model_len: 4096

# Enable for a short trace run after replacing the collector address.
# tracing:
#   enabled: true
#   endpoint: http://COLLECTOR_HOST:4317
#   sample_ratio: 1.0

run:
  num_prompts: 16
  max_concurrency: 1
  # Required for random; remove this field for ShareGPT/custom.
  input_len: 1024
  output_len: 128
  num_warmups: 1
  ignore_eos: true
  temperature: 0
  save_result: true
