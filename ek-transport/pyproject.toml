[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expertkit-transport"
version = "0.1.0"
description = "Expert Kit Routed-MoE Transport middleware"
requires-python = ">=3.12"
dependencies = [
    "expertkit-proto==0.1.0",
    "grpcio>=1.71,<2",
    "numpy>=1.26,<3",
    "protobuf>=5.29.6,<8",
    "torch>=2.10,<2.12",
]

[project.optional-dependencies]
ascend-graph = ["pydantic>=2.12,<3"]
observability = [
    "opentelemetry-exporter-otlp-proto-grpc==1.39.1",
    "opentelemetry-sdk==1.39.1",
]

[tool.uv.sources]
expertkit-proto = { workspace = true }

[tool.ruff]
extend = "../pyproject.toml"
