# GPTQ W4A16 expert Worker for Qwen1.5-MoE-A2.7B.
# The weight server must provide bundles containing qweight, qzeros, and scales.
model:
  name: Qwen1.5-MoE-A2.7B-Chat-GPTQ-Int4
  weight_version: main
  num_layers: 24
  experts_per_layer: 60
  hidden_dim: 2048
  expert_intermediate_dim: 1408
  top_k: 4
  activation_dtype: fp16
  weight_dtype: fp16

worker:
  id: qwen1.5-moe-gptq-worker-0
  backend: torch
  device: cuda:0
  max_batch_tokens: 4096
  max_active_batches_per_device: 1
  device_memory_limit: 20GiB
  shutdown_grace_secs: 30

transport:
  type: grpc
  max_pending_batches_per_device: 1
  listen: 0.0.0.0:51051
  advertise: 127.0.0.1:51051

controller:
  endpoint: 127.0.0.1:5001
  heartbeat_interval_secs: 3
  heartbeat_timeout_secs: 10

weight_manager:
  max_concurrent_loads: 64
  disk_cache:
    path: /var/cache/expert-kit/worker-weights/qwen1.5-moe-gptq-worker-0
    writeback: true
  peer:
    listen: 0.0.0.0:51052
    advertise: http://127.0.0.1:51052
  weight_server_endpoint: http://127.0.0.1:6543
  auto_model_metadata: true
  metadata_required: true
  state_report:
    max_updates: 64
    max_delay_ms: 50

logging:
  level: INFO
  format: console
